name: Morning Call 9Pilla

on:
  schedule:
    # 07:00 BRT (UTC-3) = 10:00 UTC. Antecipado de propósito: a fila de cron do
    # GitHub costuma atrasar (de 20 min a algumas horas), então saímos mais cedo
    # pra a Morning Call chegar com folga antes das 09:09, quando a Raquel cola na
    # Turma. Ela confere e posta manualmente. Sem publicação automática no grupo.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: só valida a busca real (dados + notícias), não envia nada'
        type: boolean
        default: false
  # Gatilho de teste/execução: roda ao publicar melhorias no código do Morning Call
  # (também usado para re-disparar a edição do dia com dados frescos quando preciso).
  # NÃO inclui content/** de propósito, para o commit diário do bot não criar loop.
  push:
    branches: [main]
    paths:
      - '.claude/scripts/**'
      - '.claude/morning-call/**'
      - '.github/workflows/morning-call.yml'

jobs:
  morning-call:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_RAQUEL: ${{ secrets.TELEGRAM_CHAT_ID_RAQUEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IS_DRY: ${{ inputs.dry_run == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Config brapi (para geração/validação)
        run: |
          mkdir -p .claude
          # Remove espaços/newline que o copiar-colar do secret pode deixar.
          TOKEN_LIMPO=$(printf '%s' "$BRAPI_TOKEN" | tr -d '[:space:]')
          cat > .claude/config-morning-call.json << EOF
          { "brapi": { "baseUrl": "https://brapi.dev/api", "token": "${TOKEN_LIMPO}" } }
          EOF

      # ---------- DRY-RUN: só valida, não envia ----------
      - name: Dry-run (validar busca real)
        if: ${{ env.IS_DRY == 'true' }}
        run: node .claude/scripts/validate-fetch.js

      # ---------- Fluxo normal: gerar + commitar + enviar no Telegram ----------
      # Tenta o EDITORIAL (Claude, na voz da Raquel). Se falhar por qualquer
      # motivo, cai no ESQUELETO de dados — nunca fica sem Morning Call.
      - name: Gerar Morning Call do dia (editorial via Claude; fallback esqueleto)
        if: ${{ env.IS_DRY != 'true' }}
        run: |
          node .claude/scripts/generate-editorial.js || {
            echo "⚠️ Editorial falhou — usando o esqueleto de dados como fallback."
            node .claude/scripts/generate-morning-call.js
          }

      - name: Commitar a Morning Call gerada
        if: ${{ env.IS_DRY != 'true' }}
        run: |
          DATE=$(TZ="America/Sao_Paulo" date +%Y-%m-%d)
          git config user.name "9Pilla Bot"
          git config user.email "bot@9pilla.link"
          git add "content/morning-call/${DATE}.md" || true
          git commit -m "chore: Morning Call ${DATE} (gerada automaticamente)" || echo "nada a commitar"
          git pull --rebase --autostash origin main || true
          git push || echo "push falhou (sem mudanças?)"

      - name: Enviar Morning Call pronta no Telegram da Raquel
        if: ${{ env.IS_DRY != 'true' }}
        run: node .claude/scripts/notify-telegram.js
